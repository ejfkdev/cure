name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Test
        run: cargo test --release --workspace

  # Linux io_uring 批量读后端（含 5 个 ring 单测）。
  # GH Actions 的 Linux 运行器是完整虚拟机，seccomp 不拦截 io_uring
  # （本地 Docker 默认 profile 会拦截，需 --security-opt unconfined）。
  linux-io-uring:
    name: test (linux, io-uring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test with io-uring feature
        run: cargo test --release --workspace --features cure-cli/io-uring

  msrv:
    name: check (MSRV 1.74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        # 仓库锁文件是 v4 格式（cargo ≥1.78 才能解析）；零运行时依赖下
        # check 不需要外部 crate，删除后由 1.74 自行解析（改动不落盘提交）
        run: |
          rm Cargo.lock
          cargo check --workspace
